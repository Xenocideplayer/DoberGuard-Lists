name: Build lists

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # FTC paging is slow (rate-limited to 1,000 requests/hour)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Unit tests
        run: python -m unittest test_build_lists

      - name: Build and sign the bundle
        env:
          LISTS_SIGNING_KEY: ${{ secrets.LISTS_SIGNING_KEY }}
          FTC_API_KEY: ${{ secrets.FTC_API_KEY }}   # numbers are skipped when this is empty
        run: |
          if [ -z "$LISTS_SIGNING_KEY" ]; then
            echo "::error::Add the LISTS_SIGNING_KEY secret (Settings > Secrets and variables > Actions) so the lists can be signed."
            exit 1
          fi
          [ -z "$FTC_API_KEY" ] && echo "::warning::No FTC_API_KEY secret: this bundle has no new spam numbers."
          mkdir -p dist
          python build_lists.py --out dist/doberguard-lists.bin --summary dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest lists" --notes-file dist/notes.md --latest
          fi
          gh release upload latest dist/doberguard-lists.bin --clobber
          gh release edit latest --draft=false --title "Latest lists" --notes-file dist/notes.md
